<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Minimalist Yahtzee</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overscroll-behavior-y: contain; -webkit-tap-highlight-color: transparent; background: #d7dfd3; }
        #app { background:
            radial-gradient(circle at top left, rgba(255, 255, 255, 0.86), rgba(255, 255, 255, 0) 34%),
            linear-gradient(180deg, #fffdf7 0%, #f5f1e8 100%);
        }
        .table-surface {
            background:
                radial-gradient(circle at 16% 12%, rgba(255, 255, 255, 0.42), transparent 18%),
                radial-gradient(circle at 82% 0%, rgba(191, 167, 108, 0.24), transparent 24%),
                linear-gradient(145deg, #fffaf0 0%, #edf2e9 58%, #d9e4d6 100%);
            position: relative;
            isolation: isolate;
        }
        .table-surface::before {
            content: "";
            position: absolute;
            inset: 0;
            pointer-events: none;
            z-index: -1;
            background-image:
                linear-gradient(rgba(30, 64, 49, 0.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(30, 64, 49, 0.04) 1px, transparent 1px);
            background-size: 28px 28px;
            mask-image: linear-gradient(180deg, rgba(0,0,0,0.75), rgba(0,0,0,0.1) 62%, transparent);
        }
        .title-card {
            background: rgba(255, 253, 247, 0.72);
            border: 1px solid rgba(81, 108, 88, 0.18);
            box-shadow: 0 20px 45px rgba(28, 50, 38, 0.12);
            backdrop-filter: blur(12px);
        }
        .title-mark {
            background: linear-gradient(180deg, #172019 0%, #314936 100%);
            -webkit-background-clip: text;
            color: transparent;
            text-shadow: 0 12px 30px rgba(29, 49, 37, 0.16);
        }
        .title-die {
            background:
                radial-gradient(circle at 30% 24%, rgba(255,255,255,0.95), rgba(255,255,255,0) 32%),
                linear-gradient(145deg, #ffffff 0%, #f7f1e4 58%, #d5c8a8 100%);
            border: 1px solid rgba(58, 66, 54, 0.18);
            box-shadow: 0 13px 22px rgba(40, 50, 36, 0.18), inset 0 -6px 12px rgba(88, 70, 42, 0.08);
        }
        .control-panel {
            background: rgba(255, 253, 247, 0.86);
            border: 1px solid rgba(81, 108, 88, 0.16);
            box-shadow: 0 16px 32px rgba(46, 66, 50, 0.10);
            backdrop-filter: blur(10px);
        }
        .primary-action {
            background: linear-gradient(135deg, #111827 0%, #263d2f 100%);
            box-shadow: 0 12px 24px rgba(17, 24, 39, 0.22), inset 0 1px 0 rgba(255,255,255,0.18);
        }
        .secondary-action {
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.7), 0 5px 14px rgba(30, 41, 59, 0.06);
        }
        .score-row { box-shadow: inset 0 1px 0 rgba(255,255,255,0.54); }
        .dice-tray {
            background:
                linear-gradient(180deg, rgba(255,255,255,0.92), rgba(250,247,239,0.98)),
                linear-gradient(90deg, rgba(38, 61, 47, 0.06), transparent, rgba(181, 153, 86, 0.08));
        }
        .die-dot { background-color: #0f172a; border-radius: 50%; width: 8px; height: 8px; box-shadow: inset 0 1px 1px rgba(255,255,255,0.26); }
        .die {
            background:
                radial-gradient(circle at 30% 24%, rgba(255,255,255,0.95), rgba(255,255,255,0) 32%),
                linear-gradient(145deg, #ffffff 0%, #f8f4eb 54%, #ddd4bd 100%);
            border-color: rgba(71, 85, 105, 0.28);
            box-shadow: 0 8px 15px rgba(15, 23, 42, 0.13), inset 0 -5px 10px rgba(96, 77, 48, 0.08);
            transition: transform 0.2s, background-color 0.2s, border-color 0.2s, box-shadow 0.2s;
        }
        .die.held { background-color: #e5efe3; border: 2px solid #446a4f; transform: translateY(4px); box-shadow: 0 3px 8px rgba(20, 83, 45, 0.22), inset 0 0 0 2px rgba(255,255,255,0.62); }
        .die.rolling { animation: shake 0.28s infinite; }
        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            25% { transform: translate(-1px, -2px) rotate(-3deg); }
            50% { transform: translate(-3px, 0px) rotate(3deg); }
            75% { transform: translate(2px, 2px) rotate(-1deg); }
            100% { transform: translate(1px, -1px) rotate(0deg); }
        }
        body.dark-mode,
        body.dark-mode.bg-slate-100 { background-color: #050509 !important; color: #f8fafc; }
        body.dark-mode #app,
        body.dark-mode #setup-screen,
        body.dark-mode #game-screen,
        body.dark-mode #game-over-screen,
        body.dark-mode header,
        body.dark-mode footer { background-color: #050509; color: #f8fafc; }
        body.dark-mode main { background-color: #050509; }
        body.dark-mode .bg-white { background-color: #11111a !important; color: #f8fafc; }
        body.dark-mode .bg-slate-100 { background-color: #161625 !important; }
        body.dark-mode .bg-slate-200 { background-color: #2a2a3a !important; }
        body.dark-mode .bg-slate-700,
        body.dark-mode .bg-slate-950 { background-color: #facc15 !important; color: #050509 !important; }
        body.dark-mode .bg-blue-50 { background-color: #14102b !important; }
        body.dark-mode .bg-blue-700 { background-color: #39ff14 !important; color: #050509 !important; }
        body.dark-mode .bg-rose-100 { background-color: #2d0a22 !important; }
        body.dark-mode .table-surface,
        body.dark-mode .control-panel,
        body.dark-mode .title-card,
        body.dark-mode .dice-tray { background: #050509 !important; border-color: #3b3b56 !important; box-shadow: none; }
        body.dark-mode .table-surface::before { display: none; }
        body.dark-mode .title-mark { background: none; color: #f8fafc; text-shadow: 0 0 18px rgba(0, 229, 255, 0.42); }
        body.dark-mode .title-die { background: #f8fafc !important; border-color: #00e5ff !important; box-shadow: 0 0 14px rgba(0, 229, 255, 0.35); }
        body.dark-mode .text-slate-400 { color: #a8b3cf !important; }
        body.dark-mode .text-slate-500,
        body.dark-mode .text-slate-600 { color: #c4ff3d !important; }
        body.dark-mode .text-slate-900,
        body.dark-mode .text-slate-950 { color: #f8fafc !important; }
        body.dark-mode .text-blue-700,
        body.dark-mode .text-blue-800 { color: #00e5ff !important; }
        body.dark-mode .text-rose-800 { color: #ff4fd8 !important; }
        body.dark-mode .text-green-700 { color: #39ff14 !important; }
        body.dark-mode .border-slate-200,
        body.dark-mode .border-slate-300,
        body.dark-mode .border-slate-500 { border-color: #3b3b56 !important; }
        body.dark-mode .border-blue-300,
        body.dark-mode .border-blue-500 { border-color: #00e5ff !important; }
        body.dark-mode input,
        body.dark-mode select,
        body.dark-mode button { color: #f8fafc; }
        body.dark-mode input,
        body.dark-mode select { background-color: #11111a !important; border-color: #3b3b56 !important; }
        body.dark-mode button.bg-white { border-color: #ff4fd8 !important; }
        body.dark-mode .die { background-color: #f8fafc !important; border-color: #00e5ff !important; box-shadow: 0 0 12px rgba(0, 229, 255, 0.22); }
        body.dark-mode .die-dot { background-color: #050509; }
        body.dark-mode .die.held { background-color: #ff4fd8 !important; border-color: #facc15 !important; box-shadow: 0 0 16px rgba(255, 79, 216, 0.45); }
        body.dark-mode .die.held .die-dot { background-color: #050509; }
        body.dark-mode #roll-btn,
        body.dark-mode #game-over-screen button,
        body.dark-mode #setup-screen button[onclick="startGame()"] { background-color: #facc15 !important; color: #050509 !important; }
        body.dark-mode #rolls-left { background-color: #050509 !important; color: #facc15 !important; border: 1px solid #facc15; }
        ::-webkit-scrollbar { width: 0px; background: transparent; }
    </style>
</head>
<body class="bg-slate-100 text-slate-900 h-[100dvh] w-full flex justify-center overflow-hidden">

    <div id="app" class="w-full max-w-md h-full flex flex-col bg-white shadow-xl relative">

        <div id="setup-screen" class="table-surface flex-1 flex flex-col p-5 overflow-y-auto">
            <div class="title-card rounded-lg px-5 py-6 mt-1 mb-5">
                <div class="flex items-start justify-between gap-4">
                    <div class="min-w-0">
                        <p class="text-[11px] font-bold text-slate-500 uppercase tracking-[0.28em]">Classic Dice</p>
                        <h1 class="title-mark text-5xl font-black tracking-wide uppercase leading-none mt-2">Yahtzee</h1>
                        <p class="mt-3 text-sm leading-5 text-slate-600">Classic scoring with a clean table presence.</p>
                    </div>
                    <div class="grid grid-cols-2 gap-2 shrink-0 pt-1" aria-hidden="true">
                        <div class="title-die w-11 h-11 rounded-lg rotate-[-8deg] flex items-center justify-center">
                            <div class="grid grid-cols-3 grid-rows-3 gap-0.5 w-full h-full p-1.5 place-items-center">
                                <div class="die-dot col-start-1 row-start-1"></div>
                                <div class="die-dot col-start-3 row-start-1"></div>
                                <div class="die-dot col-start-2 row-start-2"></div>
                                <div class="die-dot col-start-1 row-start-3"></div>
                                <div class="die-dot col-start-3 row-start-3"></div>
                            </div>
                        </div>
                        <div class="title-die w-11 h-11 rounded-lg rotate-[7deg] flex items-center justify-center mt-3">
                            <div class="grid grid-cols-3 grid-rows-3 gap-0.5 w-full h-full p-1.5 place-items-center">
                                <div class="die-dot col-start-1 row-start-1"></div>
                                <div class="die-dot col-start-3 row-start-1"></div>
                                <div class="die-dot col-start-1 row-start-2"></div>
                                <div class="die-dot col-start-3 row-start-2"></div>
                                <div class="die-dot col-start-1 row-start-3"></div>
                                <div class="die-dot col-start-3 row-start-3"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="control-panel rounded-lg p-4 space-y-5">
                <div>
                    <div class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Preset</div>
                    <div class="grid grid-cols-2 gap-2">
                        <button onclick="applyPreset('local')" class="secondary-action py-3 rounded-lg border border-slate-300 bg-white text-sm font-semibold active:scale-95">Pass and Play</button>
                        <button onclick="applyPreset('ai')" class="secondary-action py-3 rounded-lg border border-slate-300 bg-white text-sm font-semibold active:scale-95">Vs AI</button>
                    </div>
                </div>

                <div>
                    <label for="player-count" class="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Players</label>
                    <select id="player-count" onchange="setPlayerCount(this.value)" class="w-full rounded-lg border border-slate-300 bg-white px-3 py-3 text-base font-medium">
                        <option value="1" selected>1 player</option>
                        <option value="2">2 players</option>
                        <option value="3">3 players</option>
                        <option value="4">4 players</option>
                    </select>
                </div>

                <label for="dark-mode-toggle" class="secondary-action flex items-center justify-between gap-3 rounded-lg border border-slate-300 bg-white px-3 py-3">
                    <span class="text-sm font-semibold">Dark Mode</span>
                    <input id="dark-mode-toggle" type="checkbox" onchange="setDarkMode(this.checked)" class="h-5 w-5 accent-slate-950">
                </label>

                <div>
                    <div class="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Seats</div>
                    <div id="player-config" class="space-y-2"></div>
                </div>
            </div>

            <div class="mt-auto pt-6 space-y-3">
                <button id="continue-btn" onclick="loadSavedGame()" class="hidden w-full py-3 rounded-lg border border-blue-300 bg-blue-50 text-blue-800 font-semibold active:scale-95">Continue Saved Game</button>
                <button onclick="startGame()" class="primary-action w-full py-4 rounded-lg bg-slate-950 text-white font-semibold active:scale-95 shadow-md">Start Game</button>
            </div>
        </div>

        <div id="game-screen" class="hidden flex-1 flex flex-col h-full overflow-hidden">
            <header class="p-3 border-b border-slate-200 bg-white z-10 shrink-0">
                <div class="flex justify-between items-start gap-3">
                    <div>
                        <h2 id="player-turn" class="text-base font-semibold leading-tight">Player 1</h2>
                        <p id="round-info" class="text-[11px] text-slate-500 uppercase tracking-wide leading-tight">Round 1 / 13</p>
                        <p id="turn-status" class="text-[11px] text-blue-700 font-semibold mt-0.5 min-h-3 leading-tight"></p>
                    </div>
                    <div class="text-right">
                        <p class="text-[11px] text-slate-500 uppercase tracking-wide leading-tight">Total Score</p>
                        <p id="current-score" class="text-xl font-light leading-tight">0</p>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-2 mt-2">
                    <button id="undo-btn" onclick="undoScore()" class="py-1.5 rounded-lg border border-slate-300 bg-white text-xs font-semibold disabled:opacity-40 active:scale-95">Undo Score</button>
                    <button onclick="confirmNewGame()" class="py-1.5 rounded-lg border border-slate-300 bg-white text-xs font-semibold active:scale-95">New Game</button>
                </div>
            </header>

            <main class="flex-1 overflow-hidden p-2">
                <div class="grid grid-cols-2 gap-2 h-full content-start">
                    <div class="min-w-0">
                        <h3 class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1 leading-tight">Upper</h3>
                        <div id="upper-scores" class="space-y-1"></div>
                        <div class="mt-1 p-1.5 bg-slate-100 rounded-lg flex justify-between text-xs border border-slate-200">
                            <span class="text-slate-600">Bonus at 63</span>
                            <span id="upper-bonus" class="font-medium">0/63</span>
                        </div>
                    </div>
                    <div class="min-w-0">
                        <h3 class="text-[11px] font-semibold text-slate-500 uppercase tracking-wider mb-1 leading-tight">Lower</h3>
                        <div id="lower-scores" class="space-y-1"></div>
                    </div>
                </div>
            </main>

            <footer class="dice-tray w-full bg-white border-t border-slate-200 p-2 shadow-[0_-10px_15px_-3px_rgba(0,0,0,0.05)] shrink-0 z-20">
                <div id="dice-container" class="flex justify-between mb-2 px-1"></div>
                <button id="roll-btn" onclick="rollDice()" class="primary-action w-full py-3 rounded-lg bg-slate-950 text-white font-semibold active:scale-95 shadow-md flex items-center justify-center disabled:opacity-50 disabled:active:scale-100">
                    <span id="roll-text">Roll Dice</span>
                    <span id="rolls-left" class="bg-slate-700 text-xs px-2 py-1 rounded-md ml-2">3 Left</span>
                </button>
            </footer>
        </div>

        <div id="game-over-screen" class="hidden flex-1 flex flex-col items-center justify-center p-6 bg-white z-30 absolute inset-0">
            <h1 class="text-3xl font-light mb-8 uppercase tracking-widest">Game Over</h1>
            <div id="final-standings" class="w-full space-y-3 mb-8"></div>
            <button onclick="resetGame()" class="w-full py-4 rounded-lg bg-slate-950 text-white font-semibold active:scale-95 shadow-md">
                Play Again
            </button>
        </div>

    </div>

    <script>
        const STORAGE_KEY = 'minimalist-yahtzee-state-v2';
        const THEME_STORAGE_KEY = 'minimalist-yahtzee-dark-mode';
        const MAX_UNDO = 10;

        let setupPlayers = [
            { name: 'Player 1', type: 'human' }
        ];
        let players = [];
        let currentPlayerIndex = 0;
        let currentRound = 1;
        let dice = freshDice();
        let rollsLeft = 3;
        let hasRolled = false;
        let undoStack = [];
        let aiThinking = false;
        let gameActive = false;
        let darkMode = localStorage.getItem(THEME_STORAGE_KEY) === 'true';

        const CATEGORIES = {
            ones: { id: 'ones', name: 'Ones', section: 'upper', calc: (d) => sumMatch(d, 1) },
            twos: { id: 'twos', name: 'Twos', section: 'upper', calc: (d) => sumMatch(d, 2) },
            threes: { id: 'threes', name: 'Threes', section: 'upper', calc: (d) => sumMatch(d, 3) },
            fours: { id: 'fours', name: 'Fours', section: 'upper', calc: (d) => sumMatch(d, 4) },
            fives: { id: 'fives', name: 'Fives', section: 'upper', calc: (d) => sumMatch(d, 5) },
            sixes: { id: 'sixes', name: 'Sixes', section: 'upper', calc: (d) => sumMatch(d, 6) },
            threeKind: { id: 'threeKind', name: '3 of a Kind', section: 'lower', calc: (d) => hasKind(d, 3) ? sumAll(d) : 0 },
            fourKind: { id: 'fourKind', name: '4 of a Kind', section: 'lower', calc: (d) => hasKind(d, 4) ? sumAll(d) : 0 },
            fullHouse: { id: 'fullHouse', name: 'Full House', section: 'lower', calc: (d) => isFullHouse(d) ? 25 : 0 },
            smStraight: { id: 'smStraight', name: 'Sm Straight', section: 'lower', calc: (d) => isStraight(d, 4) ? 30 : 0 },
            lgStraight: { id: 'lgStraight', name: 'Lg Straight', section: 'lower', calc: (d) => isStraight(d, 5) ? 40 : 0 },
            yahtzee: { id: 'yahtzee', name: 'Yahtzee', section: 'lower', calc: (d) => hasKind(d, 5) ? 50 : 0 },
            chance: { id: 'chance', name: 'Chance', section: 'lower', calc: (d) => sumAll(d) }
        };

        function freshDice() {
            return Array.from({ length: 5 }, (_, i) => ({ id: i, value: 1, held: false }));
        }

        function applyPreset(mode) {
            if (mode === 'local') {
                setupPlayers = setupPlayers.map((p, i) => ({ name: p.name && !p.name.startsWith('AI') ? p.name : `Player ${i + 1}`, type: 'human' }));
            } else {
                if (setupPlayers.length < 2) {
                    setupPlayers.push({ name: 'AI 1', type: 'ai' });
                }
                setupPlayers = setupPlayers.map((p, i) => i === 0
                    ? { name: p.name && !p.name.startsWith('AI') ? p.name : 'Player 1', type: 'human' }
                    : { name: p.name && p.name.startsWith('AI') ? p.name : `AI ${i}`, type: 'ai' });
            }
            renderSetup();
        }

        function setPlayerCount(value) {
            const count = Number(value);
            while (setupPlayers.length < count) {
                const i = setupPlayers.length;
                setupPlayers.push({ name: `Player ${i + 1}`, type: 'human' });
            }
            setupPlayers = setupPlayers.slice(0, count);
            if (!setupPlayers.some(p => p.type === 'human')) setupPlayers[0].type = 'human';
            renderSetup();
        }

        function updateSetupName(index, value) {
            setupPlayers[index].name = value.trim() || `Player ${index + 1}`;
        }

        function updateSetupType(index, value) {
            setupPlayers[index].type = value;
            if (!setupPlayers.some(p => p.type === 'human')) setupPlayers[index].type = 'human';
            if (setupPlayers[index].name.startsWith('AI') && value === 'human') setupPlayers[index].name = `Player ${index + 1}`;
            if (setupPlayers[index].name.startsWith('Player') && value === 'ai') setupPlayers[index].name = `AI ${index}`;
            renderSetup();
        }

        function renderSetup() {
            document.getElementById('player-count').value = String(setupPlayers.length);
            document.getElementById('dark-mode-toggle').checked = darkMode;
            document.getElementById('player-config').innerHTML = setupPlayers.map((player, i) => `
                <div class="grid grid-cols-[1fr_96px] gap-2">
                    <input value="${escapeHtml(player.name)}" oninput="updateSetupName(${i}, this.value)" class="secondary-action min-w-0 rounded-lg border border-slate-300 bg-white px-3 py-3 text-base" aria-label="Player ${i + 1} name">
                    <select onchange="updateSetupType(${i}, this.value)" class="secondary-action rounded-lg border border-slate-300 bg-white px-2 py-3 text-sm font-semibold" aria-label="Player ${i + 1} type">
                        <option value="human" ${player.type === 'human' ? 'selected' : ''}>Local</option>
                        <option value="ai" ${player.type === 'ai' ? 'selected' : ''}>AI</option>
                    </select>
                </div>
            `).join('');
            document.getElementById('continue-btn').classList.toggle('hidden', !hasSavedGame());
        }

        function setDarkMode(enabled) {
            darkMode = enabled;
            localStorage.setItem(THEME_STORAGE_KEY, String(darkMode));
            applyTheme();
            renderSetup();
        }

        function applyTheme() {
            document.body.classList.toggle('dark-mode', darkMode);
        }

        function startGame() {
            players = setupPlayers.map((p, i) => ({
                name: p.name || `Player ${i + 1}`,
                type: p.type,
                scores: {},
                yahtzeeBonusCount: 0
            }));
            currentPlayerIndex = 0;
            currentRound = 1;
            undoStack = [];
            aiThinking = false;
            gameActive = true;
            resetTurn();
            showScreen('game');
            saveGame();
            updateUI();
            scheduleAiTurn();
        }

        function resetTurn() {
            dice = freshDice();
            rollsLeft = 3;
            hasRolled = false;
        }

        function rollDice() {
            if (rollsLeft === 0 || isAiTurn()) return;
            animateDice();
            document.getElementById('roll-btn').disabled = true;

            setTimeout(() => {
                rollOpenDice();
                rollsLeft--;
                hasRolled = true;
                saveGame();
                updateUI();
            }, 400);
        }

        function animateDice() {
            document.querySelectorAll('.die').forEach(el => {
                if (!el.classList.contains('held')) el.classList.add('rolling');
            });
        }

        function rollOpenDice() {
            dice.forEach(d => {
                if (!d.held) d.value = Math.floor(Math.random() * 6) + 1;
            });
        }

        function toggleDie(id) {
            if (isAiTurn() || rollsLeft === 3 || (rollsLeft === 0 && !hasRolled)) return;
            dice[id].held = !dice[id].held;
            saveGame();
            updateUI();
        }

        function scoreCategory(categoryId) {
            if (isAiTurn()) return;
            commitScore(categoryId, true);
        }

        function commitScore(categoryId, allowUndo) {
            if (!hasRolled) return;

            const player = players[currentPlayerIndex];
            if (player.scores[categoryId] !== undefined) return;

            if (allowUndo) {
                undoStack.push(getSnapshot());
                undoStack = undoStack.slice(-MAX_UNDO);
            }

            const score = CATEGORIES[categoryId].calc(dice);
            if (hasKind(dice, 5) && player.scores.yahtzee === 50 && categoryId !== 'yahtzee') {
                player.yahtzeeBonusCount++;
            }

            player.scores[categoryId] = score;
            nextTurn();
        }

        function nextTurn() {
            currentPlayerIndex++;
            if (currentPlayerIndex >= players.length) {
                currentPlayerIndex = 0;
                currentRound++;
            }

            if (currentRound > 13) {
                endGame();
            } else {
                resetTurn();
                saveGame();
                updateUI();
                scheduleAiTurn();
            }
        }

        async function scheduleAiTurn() {
            if (!isAiTurn() || aiThinking) return;
            aiThinking = true;
            updateUI();
            await sleep(450);

            while (isAiTurn() && gameActive) {
                await playAiTurn();
                await sleep(450);
            }

            aiThinking = false;
            updateUI();
        }

        async function playAiTurn() {
            while (rollsLeft > 0) {
                if (!isAiTurn()) return;
                rollOpenDice();
                rollsLeft--;
                hasRolled = true;
                if (rollsLeft > 0) applyAiHolds();
                saveGame();
                updateUI();
                await sleep(450);
            }
            if (!hasRolled) return;
            const categoryId = chooseAiCategory(players[currentPlayerIndex]);
            await sleep(250);
            commitScore(categoryId, false);
        }

        function applyAiHolds() {
            const c = counts(dice);
            const target = Object.keys(c).map(Number).sort((a, b) => c[b] - c[a] || b - a)[0];
            dice = dice.map(d => ({ ...d, held: d.value === target }));
        }

        function chooseAiCategory(player) {
            const openCategories = Object.values(CATEGORIES).filter(cat => player.scores[cat.id] === undefined);
            const upperScore = calculateTotals(player).upperTotal;
            let best = openCategories[0];
            let bestValue = -1;

            openCategories.forEach(cat => {
                let value = cat.calc(dice);
                if (cat.section === 'upper' && upperScore < 63) value += Math.min(value, 18) * 0.4;
                if (cat.id === 'yahtzee' && value === 0) value -= 12;
                if ((cat.id === 'lgStraight' || cat.id === 'fullHouse') && value === 0) value -= 6;
                if (value > bestValue) {
                    bestValue = value;
                    best = cat;
                }
            });

            return best.id;
        }

        function undoScore() {
            if (aiThinking || undoStack.length === 0) return;
            const snapshot = undoStack.pop();
            restoreSnapshot(snapshot);
            saveGame();
            updateUI();
            scheduleAiTurn();
        }

        function getSnapshot() {
            return cloneState({
                players,
                currentPlayerIndex,
                currentRound,
                dice,
                rollsLeft,
                hasRolled
            });
        }

        function restoreSnapshot(snapshot) {
            players = cloneState(snapshot.players);
            currentPlayerIndex = snapshot.currentPlayerIndex;
            currentRound = snapshot.currentRound;
            dice = cloneState(snapshot.dice);
            rollsLeft = snapshot.rollsLeft;
            hasRolled = snapshot.hasRolled;
            gameActive = true;
            aiThinking = false;
            showScreen('game');
        }

        function endGame() {
            gameActive = false;
            localStorage.removeItem(STORAGE_KEY);
            showScreen('game-over');

            const standings = players
                .map(p => ({ ...p, ...calculateTotals(p) }))
                .sort((a, b) => b.total - a.total);

            document.getElementById('final-standings').innerHTML = standings.map((p, i) => `
                <div class="flex justify-between items-center p-4 rounded-lg ${i === 0 ? 'bg-slate-950 text-white shadow-md' : 'bg-slate-100 border border-slate-200'}">
                    <span class="font-semibold">${i === 0 ? 'Winner: ' : ''}${escapeHtml(p.name)}</span>
                    <span class="${i === 0 ? 'text-2xl font-light' : 'text-xl font-light'}">${p.total}</span>
                </div>
            `).join('');
        }

        function resetGame() {
            gameActive = false;
            undoStack = [];
            localStorage.removeItem(STORAGE_KEY);
            showScreen('setup');
            renderSetup();
        }

        function confirmNewGame() {
            if (confirm('Start a new game? Current progress will be cleared.')) resetGame();
        }

        function saveGame() {
            if (!gameActive) return;
            const state = {
                players,
                currentPlayerIndex,
                currentRound,
                dice,
                rollsLeft,
                hasRolled,
                undoStack,
                gameActive: true
            };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        }

        function hasSavedGame() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                return Boolean(saved && saved.gameActive && Array.isArray(saved.players));
            } catch {
                return false;
            }
        }

        function loadSavedGame() {
            try {
                const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
                if (!saved || !Array.isArray(saved.players)) return;
                players = saved.players;
                currentPlayerIndex = saved.currentPlayerIndex;
                currentRound = saved.currentRound;
                dice = saved.dice;
                rollsLeft = saved.rollsLeft;
                hasRolled = saved.hasRolled;
                undoStack = saved.undoStack || [];
                gameActive = true;
                aiThinking = false;
                showScreen('game');
                updateUI();
                scheduleAiTurn();
            } catch {
                localStorage.removeItem(STORAGE_KEY);
                renderSetup();
            }
        }

        function showScreen(screen) {
            document.getElementById('setup-screen').classList.toggle('hidden', screen !== 'setup');
            document.getElementById('game-screen').classList.toggle('hidden', screen !== 'game');
            document.getElementById('game-over-screen').classList.toggle('hidden', screen !== 'game-over');
        }

        const counts = (d) => { const c = {}; d.forEach(die => c[die.value] = (c[die.value] || 0) + 1); return c; };
        const sumMatch = (d, val) => d.filter(die => die.value === val).reduce((s, die) => s + die.value, 0);
        const sumAll = (d) => d.reduce((s, die) => s + die.value, 0);
        const hasKind = (d, n) => Object.values(counts(d)).some(c => c >= n);
        const isFullHouse = (d) => {
            const c = Object.values(counts(d));
            return (c.includes(3) && c.includes(2)) || c.includes(5);
        };
        const isStraight = (d, length) => {
            const vals = [...new Set(d.map(die => die.value))].sort();
            let maxSeq = 1, currentSeq = 1;
            for (let i = 1; i < vals.length; i++) {
                if (vals[i] === vals[i - 1] + 1) currentSeq++;
                else {
                    maxSeq = Math.max(maxSeq, currentSeq);
                    currentSeq = 1;
                }
            }
            return Math.max(maxSeq, currentSeq) >= length;
        };

        function calculateTotals(player) {
            const upperTotal = Object.values(CATEGORIES)
                .filter(c => c.section === 'upper')
                .reduce((sum, c) => sum + (player.scores[c.id] || 0), 0);
            const upperBonus = upperTotal >= 63 ? 35 : 0;
            const lowerTotal = Object.values(CATEGORIES)
                .filter(c => c.section === 'lower')
                .reduce((sum, c) => sum + (player.scores[c.id] || 0), 0);
            const yahtzeeBonus = player.yahtzeeBonusCount * 100;
            return {
                upperTotal,
                upperBonus,
                lowerTotal,
                yahtzeeBonus,
                total: upperTotal + upperBonus + lowerTotal + yahtzeeBonus
            };
        }

        function generateDieFace(value) {
            const dots = {
                1: ['col-start-2 row-start-2'],
                2: ['col-start-1 row-start-1', 'col-start-3 row-start-3'],
                3: ['col-start-1 row-start-1', 'col-start-2 row-start-2', 'col-start-3 row-start-3'],
                4: ['col-start-1 row-start-1', 'col-start-3 row-start-1', 'col-start-1 row-start-3', 'col-start-3 row-start-3'],
                5: ['col-start-1 row-start-1', 'col-start-3 row-start-1', 'col-start-2 row-start-2', 'col-start-1 row-start-3', 'col-start-3 row-start-3'],
                6: ['col-start-1 row-start-1', 'col-start-3 row-start-1', 'col-start-1 row-start-2', 'col-start-3 row-start-2', 'col-start-1 row-start-3', 'col-start-3 row-start-3']
            };
            return `<div class="grid grid-cols-3 grid-rows-3 gap-0.5 w-full h-full p-1.5 place-items-center">
                ${dots[value].map(pos => `<div class="die-dot ${pos}"></div>`).join('')}
            </div>`;
        }

        function updateUI() {
            if (!players.length) return;
            const player = players[currentPlayerIndex];
            const totals = calculateTotals(player);
            const aiTurn = isAiTurn();

            document.getElementById('player-turn').textContent = `${player.name}${player.type === 'ai' ? ' (AI)' : ''}`;
            document.getElementById('round-info').textContent = `Round ${currentRound} / 13`;
            document.getElementById('turn-status').textContent = aiTurn ? 'AI turn in progress' : '';
            document.getElementById('current-score').textContent = totals.total;
            document.getElementById('undo-btn').disabled = undoStack.length === 0 || aiThinking;

            document.getElementById('dice-container').innerHTML = dice.map((d, i) => `
                <div onclick="toggleDie(${i})" class="die w-11 h-11 bg-white border border-slate-300 rounded-lg shadow-sm flex items-center justify-center ${aiTurn ? 'cursor-default' : 'cursor-pointer'} ${d.held ? 'held' : ''}">
                    ${hasRolled ? generateDieFace(d.value) : '<span class="text-slate-400 font-semibold">?</span>'}
                </div>
            `).join('');

            document.getElementById('roll-text').textContent = aiTurn ? 'AI Rolling' : (hasRolled && rollsLeft > 0 ? 'Roll Again' : (rollsLeft === 0 ? 'Out of Rolls' : 'Roll Dice'));
            document.getElementById('rolls-left').textContent = `${rollsLeft} Left`;
            document.getElementById('roll-btn').disabled = aiTurn || rollsLeft === 0;

            const renderScoreItem = (cat) => {
                const isScored = player.scores[cat.id] !== undefined;
                const possibleScore = hasRolled ? cat.calc(dice) : '';
                const score = isScored ? player.scores[cat.id] : possibleScore;
                const scoreClasses = isScored
                    ? 'bg-slate-700 text-white'
                    : (hasRolled ? (score === 0 ? 'bg-rose-100 text-rose-800' : 'bg-blue-700 text-white') : 'bg-slate-100 text-slate-400');
                const rowClasses = isScored
                    ? 'bg-slate-200 border-slate-500 text-slate-950'
                    : (hasRolled && !aiTurn
                        ? 'bg-blue-50 border-blue-500 text-slate-950 cursor-pointer active:scale-95'
                        : 'bg-white border-slate-200 text-slate-400');

                return `
                    <div onclick="scoreCategory('${cat.id}')" class="score-row px-2 py-1.5 min-h-8 rounded-lg border flex justify-between items-center gap-1 transition ${rowClasses}">
                        <span class="text-xs font-semibold leading-tight truncate">${cat.name}</span>
                        <span class="min-w-7 text-center px-1.5 py-0.5 rounded-md text-xs font-bold ${scoreClasses}">${score}</span>
                    </div>
                `;
            };

            document.getElementById('upper-scores').innerHTML = Object.values(CATEGORIES).filter(c => c.section === 'upper').map(renderScoreItem).join('');
            document.getElementById('lower-scores').innerHTML = Object.values(CATEGORIES).filter(c => c.section === 'lower').map(renderScoreItem).join('');
            document.getElementById('upper-bonus').textContent = totals.upperBonus ? `${totals.upperTotal}/63 +35` : `${totals.upperTotal}/63`;
            document.getElementById('upper-bonus').className = totals.upperBonus ? 'font-bold text-green-700' : 'font-medium text-slate-600';
        }

        function isAiTurn() {
            return gameActive && players[currentPlayerIndex] && players[currentPlayerIndex].type === 'ai';
        }

        function cloneState(value) {
            return JSON.parse(JSON.stringify(value));
        }

        function sleep(ms) {
            return new Promise(resolve => setTimeout(resolve, ms));
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }

        applyTheme();
        renderSetup();
    </script>
</body>
